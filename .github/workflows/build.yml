name: Sovereign Media Player — Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Universal App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Lint Swift Code
        run: |
          brew install swiftlint
          swiftlint lint --strict

      - name: Lint Python Code
        run: |
          pip3 install flake8 --break-system-packages
          flake8 build_open_core.py

      - name: Compile ARM64 Binary
        run: |
          mkdir -p build
          swiftc \
            frontend_ui/OpenSovereignPlayerUI.swift \
            -framework Cocoa -framework AVKit -framework AVFoundation \
            -framework Metal -framework MetalKit \
            -O -whole-module-optimization \
            -target arm64-apple-macosx11.0 \
            -Xlinker -dead_strip \
            -o build/player_arm64

      - name: Compile x86_64 Binary
        run: |
          swiftc \
            frontend_ui/OpenSovereignPlayerUI.swift \
            -framework Cocoa -framework AVKit -framework AVFoundation \
            -framework Metal -framework MetalKit \
            -O -whole-module-optimization \
            -target x86_64-apple-macosx10.15 \
            -Xlinker -dead_strip \
            -o build/player_intel

      - name: Create Universal Mach-O Binary
        run: |
          mkdir -p dist
          lipo -create -output build/SovereignPlayer_universal build/player_arm64 build/player_intel
          lipo -info build/SovereignPlayer_universal

      - name: Strip Debug Symbols
        run: strip -x -ur build/SovereignPlayer_universal

      - name: Bundle into .app
        run: python3 build_open_core.py --bundle-only

      - name: Verify Architecture
        run: lipo -info dist/SovereignPlayer.app/Contents/MacOS/SovereignPlayer

      - name: Package Distribution Zip
        run: |
          cd dist
          zip -r -9 SovereignPlayer_macOS_Universal.zip SovereignPlayer.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SovereignPlayer-macOS
          path: dist/SovereignPlayer_macOS_Universal.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download macOS Build
        uses: actions/download-artifact@v4
        with:
          name: SovereignPlayer-macOS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: SovereignPlayer_macOS_Universal.zip
          name: "Sovereign Media Player ${{ github.ref_name }}"
          body: |
            ## Sovereign Media Player ${{ github.ref_name }}

            **Built by Sovereign Byte Technology**

            ### Downloads
            - **macOS** (Universal — Apple Silicon M1-M4 + Intel 2010-2020): `SovereignPlayer_macOS_Universal.zip`

            ### Quick Start
            1. Download and unzip the file above.
            2. Drag `SovereignPlayer.app` to your `/Applications` folder.
            3. Double-click to launch. Drag any video file into the window to play!

            ### What's New
            See [CHANGELOG.md](CHANGELOG.md) for full release notes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
